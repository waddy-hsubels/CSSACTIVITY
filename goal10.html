<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      color: white;
      font-size: 13px;
    }
    .div1{
      background-color: red;
      width: 200px;
      height: 200px;
    }
    .div2{
      background-color: green;
      width: 200px;
      height: 200px;
    }
    .div3{
      background-color: blue;
      width: 200px;
      height: 200px;
    }
  </style>
</head>
<body>
  <h1>CSS Display Property</h1>
<div class="div">
  <div class="div1"><p>Red Paragraph</p></div>
  <div class="div2"><p>Green Paragraph</p></div>
  <div class="div3"><p>Blue Paragraph</p></div>
</div>
</body>
</html>
