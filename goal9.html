<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal 9</title>
  <style>
    h1{
      display: flex;
    }
    .motherdiv{
      display: grid;
      grid-template-columns: 150px 150px 150px;
      height: 150px;
    }
    .div1{
      background-color: red;
      margin-right: 5px;
    }
    .div2{
      background-color: green;
      margin-right: 5px;
    }
    .div3{
      background-color: blue;
    }
    div{
      color: white;
    }
    p{
      margin: 0;
      font-size: 13px;
    }
  </style>
</head>
<body>
    <h1>CSS Display Property</h1>
  <div class="motherdiv">
    <div class="div1">
      <p>Red Paragraph</p>
    </div>
    <div class="div2">
      <p>Green Paragraph</p>
    </div>
    <div class="div3">
      <p>Blue Paragraph</p>
    </div>
  </div>
</body>
</html>
