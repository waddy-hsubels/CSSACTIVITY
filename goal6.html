<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal6</title>
  <style>
    p{
      color: white;
      margin: 0;
      margin-top: 5px;
    }
    .divbody{
      width: 100%;
      height: 100%;
    }
    .violet{
      width: 480px;
      height: 170px;
      background-color: rgb(100, 9, 100);
      padding: 10px;
      display: flex;
    }
    .blue{
      background-color: rgb(35, 24, 196);
      width: 100%;
      height: 100%;
      padding-left: 5px;
    
    }
    .red{
      background-color: rgb(218, 14, 14);
      height: 40px;
      display: flex;
      align-items: center;
      margin-bottom: 30px;
      width: 450px;
      padding-left: 10px;
      margin-top: 0px;
      margin-left: 5px;
    }
    .text{
      margin-top: 10px;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <div class="divbody">
    <div class="violet">
      <div class="blue">
        <p class="text">Yellow Text</p>
        <p class="red">White Text</p>
        <p class="text">Yellow Text</p>
        <p class="red">White Text</p>
      </div>
    </div>
  </div>
</body>
</html>
