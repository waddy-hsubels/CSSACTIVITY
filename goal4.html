<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal4</title>
  <style>
    h1{
      color: white;
    }
    body{
      background-color: rgb(73, 133, 202);
    }
    p{
      color: orange;
    }
    .size{
      font-size: 50px;
      color: white;
    }
    .weight{
      font-weight: bold;
      color: white;
    }
    .family{
      font-family:monospace;
      color: white;
    }
    .Align{
      text-align: end;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Important CSS Properties</h1>
  <p>Color</p>
  <p class="size">Font Size</p>
  <p class="weight">Font Weight</p>
  <p class="family">Font family</p>
  <p class="Align">Text Align</p>
</body>
</html>
